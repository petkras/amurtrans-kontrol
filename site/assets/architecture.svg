<rect x="275" y="170" width="170" height="115" rx="11" fill="#fff" stroke="#bfd3c5"/>
<text x="293" y="198" font-size="10" font-weight="700" letter-spacing="1" fill="#c6844d">КАНАЛ</text><text x="293" y="230" font-size="17" font-weight="700" fill="#205f53">Telegram-бот</text><text x="293" y="254" font-size="11" fill="#63716a">диалог и подтверждение</text>
<rect x="490" y="116" width="260" height="194" rx="11" fill="#fff" stroke="#205f53" stroke-width="2"/>
<text x="510" y="145" font-size="9" font-weight="700" letter-spacing=".6" fill="#c6844d">СЕРВЕРНЫЙ СЛОЙ · VERCEL</text><text x="510" y="180" font-size="16" font-weight="700" fill="#205f53">Webhook / функции</text><path d="M510 195h220" stroke="#dbe2dc"/><text x="510" y="220" font-size="12" font-weight="700" fill="#23332f">1. Проверить запрос</text><text x="510" y="243" font-size="12" font-weight="700" fill="#23332f">2. Проверить поля и правила</text><text x="510" y="266" font-size="11" font-weight="700" fill="#23332f">3. Подтвердить сводку</text><text x="510" y="290" font-size="10" fill="#63716a">LLM не меняет заказ напрямую</text>

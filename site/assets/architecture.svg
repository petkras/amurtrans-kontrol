<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="t d">
<title id="t">Архитектура АмурТранс Контроль</title>
<desc id="d">GitHub Pages предоставляет документацию. Telegram-бот на Vercel вызывает серверные правила заказа и постоянную базу данных. Через Vercel AI Gateway языковая модель помогает разобрать текст, но результат проверяет сервер.</desc>
<rect width="1000" height="400" rx="18" fill="#eaf1ec"/>
<g font-family="Arial,sans-serif">

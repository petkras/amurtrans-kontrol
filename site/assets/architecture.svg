<text x="818" y="127" font-size="10" font-weight="700" letter-spacing="1" fill="#c6844d">ЯЗЫКОВАЯ МОДЕЛЬ</text><text x="818" y="159" font-size="16" font-weight="700" fill="#205f53">Llama 4 Scout</text><text x="818" y="183" font-size="11" fill="#63716a">разбор текста / справка</text><text x="818" y="199" font-size="10" fill="#63716a">через AI Gateway</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" role="img" aria-labelledby="title desc">
<title id="title">Реализованная архитектура АмурТранс Контроль</title>
<desc id="desc">Пользователь открывает Wiki на GitHub Pages или общается с Telegram-ботом. Telegram Bot API доставляет сообщения в webhook на Vercel. Код проверяет форму заявки и отвечает пользователю. Команда дашборда открывает отдельное Python Dash-приложение на Vercel с учебным CSV.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#648a78"/></marker></defs>
<rect width="1100" height="440" rx="20" fill="#eef3ef"/>
<g font-family="Arial,sans-serif" fill="#23332f">
<text x="34" y="43" font-size="22" font-weight="700">Архитектура работающего прототипа</text>
<text x="34" y="68" font-size="13" fill="#63716a">Вариант 8 · обработка заявки на перевозку · раздельное размещение компонентов</text>
<rect x="34" y="112" width="190" height="106" rx="13" fill="#fff" stroke="#b8d0c0"/>
<text x="51" y="140" font-size="11" font-weight="700" fill="#c6844d">ПОЛЬЗОВАТЕЛЬ</text><text x="51" y="171" font-size="18" font-weight="700" fill="#205f53">Клиент</text><text x="51" y="192" font-size="12" fill="#63716a">Заявка или чтение Wiki</text>
<rect x="300" y="108" width="220" height="113" rx="13" fill="#fff" stroke="#b8d0c0"/>
<text x="317" y="136" font-size="11" font-weight="700" fill="#c6844d">КАНАЛ</text><text x="317" y="167" font-size="18" font-weight="700" fill="#205f53">Telegram Bot API</text><text x="317" y="191" font-size="12" fill="#63716a">Сообщения и команды</text>
<rect x="601" y="108" width="445" height="113" rx="13" fill="#fff" stroke="#b8d0c0"/>
<text x="620" y="136" font-size="11" font-weight="700" fill="#c6844d">VERCEL FUNCTION</text><text x="620" y="165" font-size="18" font-weight="700" fill="#205f53">Webhook → проверка шаблона</text><text x="620" y="190" font-size="12" fill="#63716a">Секрет запроса · обязательные поля · ответ без сохранения заказа</text>
<rect x="300" y="281" width="220" height="113" rx="13" fill="#fff" stroke="#b8d0c0"/>
<text x="317" y="309" font-size="11" font-weight="700" fill="#c6844d">ДОКУМЕНТАЦИЯ</text><text x="317" y="340" font-size="18" font-weight="700" fill="#205f53">GitHub Pages</text><text x="317" y="364" font-size="12" fill="#63716a">Wiki, BPMN, требования</text>
<rect x="601" y="281" width="445" height="113" rx="13" fill="#fff" stroke="#b8d0c0"/>
<text x="620" y="309" font-size="11" font-weight="700" fill="#c6844d">АНАЛИТИКА</text><text x="620" y="340" font-size="18" font-weight="700" fill="#205f53">Python Dash на Vercel</text><text x="620" y="364" font-size="12" fill="#63716a">Фильтры · KPI · графики · синтетический CSV</text>
<g stroke="#648a78" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><path d="M224 164H300"/><path d="M520 164H601"/><path d="M601 205H536"/><path d="M129 218V337H300"/><path d="M410 221V259H823V281"/></g>
<text x="528" y="149" font-size="11" fill="#63716a">HTTPS webhook</text><text x="528" y="251" font-size="11" fill="#63716a">команда /dashboard → ссылка</text>
<text x="34" y="421" font-size="12" fill="#63716a">Источники данных бота и дашборда не связаны: интеграция выполняется ссылкой из команды.</text>
</g></svg>

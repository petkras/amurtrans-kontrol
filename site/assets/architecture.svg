<text x="28" y="61" font-size="11" fill="#63716a">Модель интерпретирует сообщения; сервер проверяет и выполняет операции</text>
<rect x="25" y="100" width="190" height="120" rx="11" fill="#fff" stroke="#bfd3c5"/>
<text x="42" y="126" font-size="10" font-weight="700" letter-spacing="1" fill="#c6844d">БАЗА ЗНАНИЙ</text><text x="42" y="158" font-size="17" font-weight="700" fill="#205f53">GitHub Pages</text><text x="42" y="182" font-size="11" fill="#63716a">Wiki и архитектура</text><text x="42" y="200" font-size="10" fill="#63716a">статический сайт</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="t d"><title id="t">Сценарии обработки заказа</title><desc id="d">После заявки данные проверяются. Неполные данные возвращаются на уточнение, полные переходят к расчёту. При согласовании клиентом заказ планируется, исполняется и закрывается.</desc><rect width="960" height="330" rx="18" fill="#eaf1ec"/><g font-family="Arial,sans-serif"><text x="30" y="38" fill="#23332f" font-size="15" font-weight="700">Развилки при обработке заявки</text><text x="30" y="61" fill="#63716a" font-size="11">Исключения возвращают заказ к проверяемой точке, а не пропускают контроль</text></g><g stroke="#98b49e" stroke-width="2" fill="none"><path d="M204 165h38"/><path d="M419 165h38"/><path d="M634 165h38"/><path d="M840 165h27"/><path d="M333 202v48h-205v-48"/><path d="M545 202v48h210v-48"/></g><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="30" y="130" width="174" height="72" rx="9" fill="#fff" stroke="#bfd3c5"/><text x="117" y="169" fill="#205f53" font-size="13" font-weight="700">Заявка</text><rect x="242" y="130" width="177" height="72" rx="9" fill="#fff" stroke="#bfd3c5"/><text x="330" y="160" fill="#205f53" font-size="13" font-weight="700">Данные полные?</text><text x="330" y="181" fill="#63716a" font-size="10">нет → уточнение</text><rect x="457" y="130" width="177" height="72" rx="9" fill="#fff" stroke="#bfd3c5"/><text x="545" y="160" fill="#205f53" font-size="13" font-weight="700">Расчёт и условия</text><text x="545" y="181" fill="#63716a" font-size="10">проверка логистом</text><rect x="672" y="130" width="168" height="72" rx="9" fill="#fff" stroke="#bfd3c5"/><text x="756" y="160" fill="#205f53" font-size="13" font-weight="700">Согласовано?</text><text x="756" y="181" fill="#63716a" font-size="10">нет → изменение</text><rect x="867" y="130" width="64" height="72" rx="9" fill="#205f53"/><text x="899" y="170" fill="#fff" font-size="11" font-weight="700">Рейс</text><text x="128" y="269" fill="#63716a" font-size="11">Запросить уточнение</text><text x="754" y="269" fill="#63716a" font-size="11">Пересчитать или отменить</text></g><text x="30" y="307" font-family="Arial,sans-serif" font-size="11" fill="#63716a">Рисунок 4 — Основной путь и две точки возврата</text></svg>

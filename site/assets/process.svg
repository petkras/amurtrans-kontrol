<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 250" role="img" aria-labelledby="t d"><title id="t">Процесс обработки заказа</title><desc id="d">Последовательность: заявка, проверка и расчёт, планирование, исполнение, закрытие. На каждом переходе есть контроль результата.</desc><rect width="1040" height="250" rx="18" fill="#eaf1ec"/><g font-family="Arial,sans-serif" fill="#23332f"><text x="34" y="43" font-size="14" font-weight="700">Сквозной процесс: от заявки до закрытия</text><text x="34" y="66" font-size="11" fill="#63716a">Последовательность действий и контрольных результатов</text></g><g stroke="#a8bbad" stroke-width="2" fill="none"><path d="M212 146H238"/><path d="M408 146H434"/><path d="M604 146H630"/><path d="M800 146H826"/></g><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="34" y="100" width="178" height="92" rx="10" fill="#fff" stroke="#c7d9cd"/><text x="123" y="130" font-size="12" font-weight="700" fill="#205f53">01 · Заявка</text><text x="123" y="153" font-size="10" fill="#63716a">данные клиента и груза</text><rect x="238" y="100" width="170" height="92" rx="10" fill="#fff" stroke="#c7d9cd"/><text x="323" y="130" font-size="12" font-weight="700" fill="#205f53">02 · Проверка</text><text x="323" y="153" font-size="10" fill="#63716a">условия и расчёт</text><rect x="434" y="100" width="170" height="92" rx="10" fill="#fff" stroke="#c7d9cd"/><text x="519" y="130" font-size="12" font-weight="700" fill="#205f53">03 · План</text><text x="519" y="153" font-size="10" fill="#63716a">рейс и ресурсы</text><rect x="630" y="100" width="170" height="92" rx="10" fill="#fff" stroke="#c7d9cd"/><text x="715" y="130" font-size="12" font-weight="700" fill="#205f53">04 · Исполнение</text><text x="715" y="153" font-size="10" fill="#63716a">события и отклонения</text><rect x="826" y="100" width="180" height="92" rx="10" fill="#fff" stroke="#c7d9cd"/><text x="916" y="130" font-size="12" font-weight="700" fill="#205f53">05 · Закрытие</text><text x="916" y=
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="t d"><title id="t">Концептуальная модель данных</title><desc id="d">Клиент создаёт заказы. Заказ связан с точками маршрута, версиями, рейсами, документами, инцидентами и претензиями.</desc><rect width="960" height="360" rx="18" fill="#eaf1ec"/><g font-family="Arial,sans-serif"><text x="28" y="38" fill="#23332f" font-size="15" font-weight="700">Связи основных сущностей</text><text x="28" y="61" fill="#63716a" font-size="11">Концептуальная модель; физическая схема БД будет уточнена перед реализацией</text></g><g stroke="#9bb6a2" stroke-width="2" fill="none"><path d="M215 168H260"/><path d="M480 168H532"/><path d="M480 168V102H532"/><path d="M480 168V238H532"/><path d="M732 102H780"/><path d="M732 168H780"/><path d="M732 238H780"/></g><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="25" y="132" width="190" height="74" rx="9" fill="#fff" stroke="#bfd3c5"/><text x="120" y="163" fill="#205f53" font-size="14" font-weight="700">Клиент</text><text x="120" y="184" fill="#63716a" font-size="10">1 → N заказов</text><rect x="260" y="125" width="220" height="88" rx="9" fill="#205f53"/><text x="370" y="159" fill="#fff" font-size="17" font-weight="700">Заказ</text><text x="370" y="183" fill="#dcefe5" font-size="10">центр предметной модели</text><rect x="532" y="69" width="200" height="67" rx="9" fill="#fff" stroke="#bfd3c5"/><text x="632" y="99" fill="#205f53" font-size="13" font-weight="700">Версия условий</text><text x="632" y="118" fill="#63716a" font-size="10">история согласования</text><rect x="532" y="145" width="200" height="67" rx="9" fill="#fff" stroke="#bfd3c5"/><text x="632" y="174" fill="#205f53" font-size="13" font-weight="700">Рейс</text><text x="632" y="193" fill="#63716a" font-size="10">исполнение перевозки</text><rect x="532" y="221" width="200" height="67" rx="9" fill="#fff" stroke="#bfd3c5"/><text x="632" y="250" fill="#205f53" font-size="13" font-weight="700">Документ</text><text x="632" y="269" fill="#63716a" font-size="10">акт, накладная, счёт</text><rect x="780" y="69" width="155" height="67" rx="9" fill="#fff" stroke="#bfd3c5"/><text x="857" y="109" fill="#205f53" font-size="12" font-weight="700">Точка маршрута</text><rect x="780" y="145" width="155" height="67" rx="9" fill="#fff" stroke="#bfd3c5"/><text x="857" y="185" fill="#205f53" font-size="12" font-weight="700">Событие рейса</text><rect x="780" y="221" width="155" height="67" rx="9" fill="#fff" stroke="#bfd3c5"/><text x="857" y="261" fill="#205f53" font-size="12" font-weight="700">Инцидент / претензия</text></g><text x="28" y="333" font-family="Arial,sans-serif" font-size="11" fill="#63716a">Рисунок 3 — Ключевые связи данных заказа</text></svg>

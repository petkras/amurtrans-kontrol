<rect x="0" y="67" width="188" height="582" fill="#eaf1ec"/><g font-family="Arial,sans-serif" font-size="12"><text x="24" y="112" fill="#63716a">РАБОЧЕЕ МЕСТО</text><rect x="13" y="135" width="161" height="38" rx="7" fill="#d9e8de"/><text x="28" y="159" font-weight="700" fill="#205f53">Диспетчерский обзор</text><text x="28" y="202" fill="#63716a">Все заказы</text><text x="28" y="240" fill="#63716a">Исключения</text><text x="28" y="278" fill="#63716a">Документы</text><path d="M23 304H164" stroke="#cadbd0"/><text x="28" y="337" fill="#63716a">Проектная модель</text></g>
<g font-family="Arial,sans-serif"><text x="218" y="108" font-size="11" fill="#7b8a80">Рабочее место / Учебный обзор</text><text x="218" y="151" font-size="28" font-weight="700" fill="#23332f">Диспетчерский обзор</text><text x="218" y="176" font-size="12" fill="#63716a">Сначала отклонения и следующий ответственный шаг, затем общая картина.</text></g>
<rect x="218" y="202" width="702" height="77" rx="10" fill="#e4eeea"/><g font-family="Arial,sans-serif"><text x="240" y="232" font-size="11" font-weight="700" letter-spacing="1" fill="#205f53">ЗОНА ВНИМАНИЯ</text><text x="240" y="258" font-size="14" font-weight="700" fill="#23332f">Проверить изменение условий до назначения рейса</text><rect x="786" y="223" width="113" height="34" rx="7" fill="#fff"/><text x="843" y="244" text-anchor="middle" font-size="11" font-weight="700" fill="#205f53">Открыть заказ →</text></g>
<g font-family="Arial,sans-serif"><text x="218" y="319" font-size="15" font-weight="700" fill="#23332f">Заказы по этапам</text><text x="218" y="337" font-size="10" fill="#63716a">Примеры карточек — не показатели работающей компании</text></g>

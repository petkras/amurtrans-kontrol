<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" role="img" aria-labelledby="title desc">
<title id="title">Концептуальный макет диспетчерского обзора АмурТранс Контроль</title>
<desc id="desc">Светлый интерфейс в палитре Wiki: список рейсов по состоянию, зона внимания, журнал отклонений и карточки заказов. Показаны учебные примеры, а не действующие перевозки.</desc>
<rect width="960" height="650" rx="16" fill="#f7f8f5"/><rect x="1" y="1" width="958" height="648" rx="15" fill="none" stroke="#dbe2dc"/>

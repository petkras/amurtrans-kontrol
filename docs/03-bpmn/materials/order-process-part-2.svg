x="10" fill="white" stroke="#2d7058" stroke-width="2"/><text x="260.0" y="1207.0" text-anchor="middle" font-family="Arial" font-size="15" fill="#203b30">Назначить</text><text x="260.0" y="1225.0" text-anchor="middle" font-family="Arial" font-size="15" fill="#203b30">автомобиль и</text><text x="260.0" y="1243.0" text-anchor="middle" font-family="Arial" font-size="15" fill="#203b30">водителя</text><path d="M430 1180l30 30-30 30-30-30Z" fill="#fff8ea" stroke="#a57532" stroke-width="2"/><path d="M420 1200l20 20m0-20-20 20" stroke="#a57532" stroke-width="2"/><text x="430" y="1168" text-anchor="middle" font-family="Arial" font-size="14" fill="#664723">Ресурсы назначены?</text><rect x="180" y="1300" width="160" height="80" rx="10" fill="white" stroke="#2d7058" stroke-width="2"/><text x="260.0" y="1327.0" text-anchor="middle" font-family="Arial" font-size="15" fill="#203b30">Подобрать другой</text><text x="260.0" y="1345.0" text-anchor="middle" font-family="Arial" font-size="15" fill="#203b30">транспорт или</text><text x="260.0" y="1363.0" text-anchor="middle" font-family="Arial" font-size="15" fill="#203b30">водителя</text><rect x="620" y="1540" width="160" height="80" rx="10" fill="white" stroke="#2d7058" stroke-width="2"/><text x="700.0" y="1576.0" text-anchor="middle" font-family="Arial" font-size="15" fill="#203b30">Получить маршрут и</text><text x="700.0" y="1594.0" text-anchor="middle" font-family="Arial" font-size="15" fill="#203b30">документы</text><rect x="840" y="1540" width="160" height="80" rx="10" fill="white" stroke="#2d7058" stroke-width="2"/><text x="920.0" y="1585.0" text-anchor="middle" font-family="Arial" font-size="15" fill="#203b30">Прибыть на погрузку</text><rect x="1060" y="1540" width="160" height="80" rx="10" fill="white" stroke="#2d7058" stroke-width="2"/><text x="1140.0" y="1576.0" text-anchor="middle" font-family="Arial" font-size="15" fill="#203b30">Принять груз и</text><text x="1140.0" y="1594.0" text-anchor="middle" font-family="Arial" font-size="15" fill="#203b30">начать рейс</text><rect x="1380" y="1180" width="160" height="80" rx="10" fill="white" stroke="#2d7058" stroke-width="2"/><text x="1460.0" y="1216.0" text-anchor="middle" font-family="Arial" font-size="15" fill="#203b30">Контролировать рейс</text><text x="1460.0" y="1234.0" text-anchor="middle" font-family="Arial" font-size="15" fill="#203b30">и события</text><path d="M1630 1180l30 30-30 30-30-30Z" fill="#fff8ea" stroke="#a57532" stroke-width="2"/><path d="M1620 1200l20 20m0-20-20 20" stroke="#a57532" stroke-width="2"/><text x="1690" y="1176" font-family="Arial" font-size="14" fill="#664723">Есть отклонение?</text><rect x="1820" y="1300" width="160" height="80" rx="10" fill="white" stroke="#2d7058" stroke-width="2"/><text x="1900.0" y="1336.0" text-anchor="middle" font-family="Arial" font-size="15" fill="#203b30">Создать карточку</text><text x="1900.0" y="1354.0" text-anchor="middle" font-family="Arial" font-size="15" fill="#203b30">инцидента</text><rect x="2040" y="1300" width="160" height="80" rx="10" fill="white" stroke="#2d7058" stroke-width="2"/><text x="2120.0" y="1336.0" text-anchor="middle" font-family="Arial" font-size="15" fill="#203b30">Согласовать решение</text><text x="2120.0" y="1354.0" text-anchor="middle" font-family="Arial" font-size="15" fill="#203b30">по инциденту</text><rect x="2260" y="1660" width="160" height="80" rx="10" fill="white" stroke="#2d7058" stroke-width="2"/><text x="2340.0" y="1687.0" text-anchor="middle" font-family="Arial" font-size="15" fill="#203b30">Продолжить рейс по</text><text x="2340.0" y="1705.0" text-anchor="middle" font-family="Arial" font-size="15" fill="#203b30">согласованному</text><text x="2340.0" y="1723.0" text-anchor="middle" font-family="Arial" font-size="15" fill="#203b30">решению</text><path d="M2510 1660l30 30-30 30-30-30Z" fill="#fff8ea" stroke="#a57532" stroke-width="2"/><path d="M2500 1680l20 20m0-20-20 20" stroke="#a57532" stroke-width="2"/><text x="2510" y="1648" text-anchor="middle" font-family="Arial" font-size="14" fill="#664723">Отклонение устранено?</text><rect x="1820" y="1540" width="160" height="80" rx="10" fill="white" stroke="#2d7058" stroke-width="2"/><text x="1900.0" y="1585.0" text-anchor="middle" font-family="Arial" font-size="15" fill="#203b30">Доставить груз</text><rect x="1820" y="1660" width="160" height="80" rx="10" fill="white" stroke="#2d7058" stroke-width="2"/><text x="1900.0" y="1687.0" text-anchor="middle" font-family="Arial" font-size="15" fill="#203b30">Получить</text><text x="1900.0" y="1705.0" text-anchor="middle" font-family="Arial" font-size="15" fill="#203b30">подтверждение</text><text x="1900.0" y="1723.0" text-anchor="middle" font-family="Arial" font-size="15" fill="#203b30">доставки</text><path d="M2830 460l30 30-30 30-30-30Z" fill="#fff8ea" stroke="#a57532" stroke-width="2"/><path d="M2820 480l20 20m0-20-20 20" stroke="#a57532" stroke-width="2"/><text x="2830" y="448" text-anchor="middle" font-family="Arial" font-size="14" fill="#664723">Есть претензия?</text><rect x="3020" y="460" width="160" height="80" rx="10" fill="white" stroke="#2d7058" stroke-width="2"/><text x="3100.0" y="487.0" text-anchor="middle" font-family="Arial" font-size="15" fill="#203b30">Зарегистрировать</text><text x="3100.0" y="505.0" text-anchor="middle" font-family="Arial" font-size="15" fill="#203b30">претензию и</text><text x="3100.0" y="523.0" text-anchor="middle" font-family="Arial" font-size="15" fill="#203b30">доказательства</text><rect x="3240" y="460" width="160" height="80" rx="10" fill="white" stroke="#2d7058" stroke-width="2"/><text x="3320.0" y="478.0" text-anchor="middle" font-family="Arial" font-size="15" fill="#203b30">Обработать</text><text x="3320.0" y="496.0" text-anchor="middle" font-family="Arial" font-size="15" fill="#203b30">претензию и</text><text x="3320.0" y="514.0" text-anchor="middle" font-family="Arial" font-size="15" fill="#203b30">зафиксировать</text><text x="3320.0" y="532.0" text-anchor="middle" font-family="Arial" font-size="15" fill="#203b30">решение</text><rect x="3240" y="1540" width="160" height="80" rx="10" fill="white" stroke="#2d7058" stroke-width="2"/><text x="3320.0" y="1567.0" text-anchor="middle" font-family="Arial" font-size="15" fill="#203b30">Передать</text><text x="3320.0" y="1585.0" text-anchor="middle" font-family="Arial" font-size="15" fill="#203b30">закрывающие</text><text x="3320.0" y="1603.0" text-anchor="middle" font-family="Arial" font-size="15" fill="#203b30">документы</text><rect x="3460" y="1900" width="160" height="80" rx="10" fill="white" stroke="#2d7058" stroke-width="2"/><text x="3540.0" y="1936.0" text-anchor="middle" font-family="Arial" font-size="15" fill="#203b30">Проверить документы</text><text x="3540.0" y="1954.0" text-anchor="middle" font-family="Arial" font-size="15" fill="#203b30">и выставить счёт</text><rect x="3680" y="1900" width="160" height="80" rx="10" fill="white" stroke="#2d7058" stroke-width="2"/><text x="3760.0" y="1927.0" text-anchor="middle" font-family="Arial" font-size="15" fill="#203b30">Проверить оплату</text><text x="3760.0" y="1945.0" text-anchor="middle" font-family="Arial" font-size="15" fill="#203b30">или передачу</text><text x="3760.0" y="1963.0" text-anchor="middle" font-family="Arial" font-size="15" fill="#203b30">задолженности</text><rect x="3900" y="1900" width="160" height="80" rx="10" fill="white" stroke="#2d7058" stroke-width="2"/><text x="3980.0" y="1945.0" text-anchor="middle" font-family="Arial" font-size="15" fill="#203b30">Закрыть заказ</text><circle cx="4150" cy="1930" r="28" fill="white" stroke="#2d7058" stroke-width="4"/><text x="4150" y="1985" text-anchor="middle" font-family="Arial" font-size="14" fill="#203b30">Заказ закрыт</text></svg>
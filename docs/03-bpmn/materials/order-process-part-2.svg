етензию и</text><text x="3100.0" y="634.0" text-anchor="middle" font-family="Arial" font-size="15" fill="#203b30">зафиксировать</text><text x="3100.0" y="652.0" text-anchor="middle" font-family="Arial" font-size="15" fill="#203b30">решение</text><rect x="3020" y="1540" width="160" height="80" rx="10" fill="white" stroke="#2d7058" stroke-width="2"/><text x="3100.0" y="1567.0" text-anchor="middle" font-family="Arial" font-size="15" fill="#203b30">Передать</text><text x="3100.0" y="1585.0" text-anchor="middle" font-family="Arial" font-size="15" fill="#203b30">закрывающие</text><text x="3100.0" y="1603.0" text-anchor="middle" font-family="Arial" font-size="15" fill="#203b30">документы</text><rect x="3240" y="1900" width="160" height="80" rx="10" fill="white" stroke="#2d7058" stroke-width="2"/><text x="3320.0" y="1936.0" text-anchor="middle" font-family="Arial" font-size="15" fill="#203b30">Проверить документы</text><text x="3320.0" y="1954.0" text-anchor="middle" font-family="Arial" font-size="15" fill="#203b30">и выставить счёт</text><rect x="3460" y="1900" width="160" height="80" rx="10" fill="white" stroke="#2d7058" stroke-width="2"/><text x="3540.0" y="1927.0" text-anchor="middle" font-family="Arial" font-size="15" fill="#203b30">Проверить оплату</text><text x="3540.0" y="1945.0" text-anchor="middle" font-family="Arial" font-size="15" fill="#203b30">или передачу</text><text x="3540.0" y="1963.0" text-anchor="middle" font-family="Arial" font-size="15" fill="#203b30">задолженности</text><rect x="3680" y="1900" width="160" height="80" rx="10" fill="white" stroke="#2d7058" stroke-width="2"/><text x="3760.0" y="1945.0" text-anchor="middle" font-family="Arial" font-size="15" fill="#203b30">Закрыть заказ</text><circle cx="3930" cy="1930" r="28" fill="white" stroke="#2d7058" stroke-width="4"/><text x="3930" y="1985" text-anchor="middle" font-family="Arial" font-size="14" fill="#203b30">Заказ закрыт</text></svg>